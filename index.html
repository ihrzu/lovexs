<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeteZah Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            backdrop-filter: blur(20px);
            z-index: 1;
        }

        .bg-blur.unblur {
            backdrop-filter: blur(0px);
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            left: -270px;
            width: 270px;
            height: 100vh;
            background: rgba(22, 22, 26, 0.85);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 999;
            padding: 30px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar.open {
            left: 0;
        }

        .pull-button {
            position: absolute;
            top: 80px;
            left: 270px;
            background: rgba(22, 22, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-left: none;
            border-radius: 0 12px 12px 0;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(25px);
            padding: 14px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 6px 0 20px rgba(0, 0, 0, 0.6);
            transition: background 0.2s ease, color 0.2s ease;
            z-index: 1000;
        }

        .pull-button span {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        .pull-button:hover {
            background: rgba(35, 35, 42, 0.95);
            color: #38bdf8;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-icons {
            display: flex;
            gap: 12px;
            color: #718096;
            font-size: 14px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #718096;
        }

        .active-tab-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            color: #fff;
        }

        .sidebar-nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .nav-grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #a0aec0;
            padding: 10px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .nav-grid-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: auto;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #a0aec0;
            cursor: pointer;
            transition: color 0.2s;
        }

        .link-item:hover {
            color: #fff;
        }

        .new-tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-tab-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .sidebar-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
        }

        .user-status {
            font-size: 10px;
            color: #718096;
        }

        /* LOGIN BOX */
        .login-box {
            position: relative;
            z-index: 100;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 25px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .login-box h2 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* MAIN VIEWPORT */
        .single-tab-viewport {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            height: 82vh;
            background: rgba(14, 14, 18, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            z-index: 100;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
        }

        .single-tab-viewport.active {
            display: flex;
        }

        .tab-header {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .window-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .win-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .close-btn { background: #ff5f56; }
        .min-btn { background: #ffbd2e; }
        .max-btn { background: #27c93f; }

        .home-nav-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
        }

        .home-nav-btn:hover { color: #fff; }

        .current-tab-url {
            font-size: 12px;
            color: #888;
        }

        .tab-body {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0c;
            overflow: hidden;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .top-icons {
            display: flex;
            gap: 14px;
        }

        .top-icons span {
            color: #888;
            font-size: 16px;
            cursor: pointer;
        }

        .top-icons span:hover { color: #fff; }

        .big-heart {
            font-size: 120px;
            font-weight: 900;
            letter-spacing: -6px;
            color: #fff;
            line-height: 1;
            user-select: none;
        }

        .search-box {
            width: 420px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }

        .button-dock {
            display: flex;
            gap: 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 30px;
            border-radius: 24px;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            background: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: transform 0.2s ease;
        }

        .dock-item:hover .icon-circle { transform: translateY(-3px); }

        /* GAMES GRID VIEW */
        .games-view {
            display: none;
            width: 100%;
            height: 100%;
            padding: 24px 30px;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .games-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .game-search-input {
            width: 280px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            padding-bottom: 20px;
        }

        .game-card {
            aspect-ratio: 1;
            background: #181820;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            padding: 10px 6px 6px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* EMBED FRAME */
        .web-frame {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="bg-blur" id="bgLayer"></div>

    <aside class="sidebar" id="sidebar">
        <button class="pull-button" onclick="toggleSidebar()" title="Toggle Sidebar">
            <span>PeteZah</span>
        </button>

        <div class="sidebar-header">
            <h1 class="sidebar-title">PeteZah</h1>
            <div class="header-icons">
                <i class="fa-solid fa-bolt"></i>
                <i class="fa-regular fa-bookmark"></i>
            </div>
        </div>

        <div class="sidebar-section">
            <span class="section-label">TABS</span>
            <div class="active-tab-card active" id="sidebarTabCard" onclick="goHome()">
                <i class="fa-solid fa-house"></i>
                <span id="sidebarTabName">Main Tab</span>
            </div>
        </div>

        <div class="sidebar-nav-grid">
            <div class="nav-grid-item" onclick="openGamesView()"><i class="fa-solid fa-gamepad"></i><span>Games</span></div>
            <div class="nav-grid-item" onclick="goHome()"><i class="fa-solid fa-grip"></i><span>Apps</span></div>
            <div class="nav-grid-item" onclick="goHome()"><i class="fa-solid fa-robot"></i><span>AI</span></div>
            <div class="nav-grid-item" onclick="goHome()"><i class="fa-solid fa-music"></i><span>Music</span></div>
            <div class="nav-grid-item" onclick="goHome()"><i class="fa-solid fa-film"></i><span>Movies</span></div>
            <div class="nav-grid-item" onclick="goHome()"><i class="fa-regular fa-comment-dots"></i><span>Chat</span></div>
        </div>

        <div class="sidebar-links">
            <div class="link-item" onclick="goHome()"><i class="fa-regular fa-bookmark"></i><span>Saved</span></div>
            <div class="link-item" onclick="goHome()"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></div>
            <div class="link-item" onclick="goHome()"><i class="fa-solid fa-puzzle-piece"></i><span>Extensions</span></div>
        </div>

        <button class="new-tab-btn" onclick="goHome()">
            <i class="fa-solid fa-plus"></i> New Tab
        </button>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar"><i class="fa-regular fa-user"></i></div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUsername">Guest</span>
                    <span class="user-status">Sign in</span>
                </div>
            </div>
            <i class="fa-solid fa-command cmd-icon"></i>
        </div>
    </aside>

    <div class="login-box" id="loginBox">
        <h2>welcome back</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="userInput" placeholder="username" required>
            <input type="password" placeholder="password" required>
            <button type="submit" class="login-btn">login</button>
        </form>
    </div>

    <div class="single-tab-viewport" id="dashboard">
        <div class="tab-header">
            <div class="window-controls">
                <button class="win-btn close-btn" onclick="goHome()"></button>
                <button class="win-btn min-btn" onclick="toggleSidebar()"></button>
                <button class="win-btn max-btn" onclick="goHome()"></button>
            </div>
            <button class="home-nav-btn" onclick="goHome()">
                <i class="fa-solid fa-house"></i>
            </button>
            <span class="current-tab-url" id="currentUrl">petezah://home</span>
        </div>

        <div class="tab-body">
            <div class="center-content" id="homeView">
                <div class="top-icons">
                    <span onclick="openGamesView()"><i class="fa-solid fa-gamepad"></i></span>
                    <span onclick="goHome()"><i class="fa-brands fa-twitch"></i></span>
                    <span onclick="goHome()"><i class="fa-brands fa-discord"></i></span>
                    <span onclick="goHome()"><i class="fa-brands fa-spotify"></i></span>
                </div>

                <div class="big-heart"><3</div>

                <form class="search-box" onsubmit="handleSearch(event)">
                    <i class="fa-solid fa-magnifying-glass" style="color: #666;"></i>
                    <input type="text" id="urlInput" placeholder="Have anything in mind?">
                </form>

                <div class="button-dock">
                    <div class="dock-item" onclick="openGamesView()">
                        <div class="icon-circle"><i class="fa-solid fa-gamepad"></i></div>
                        <span>games</span>
                    </div>
                    <div class="dock-item" onclick="goHome()">
                        <div class="icon-circle"><i class="fa-brands fa-twitch"></i></div>
                        <span>twitch</span>
                    </div>
                    <div class="dock-item" onclick="goHome()">
                        <div class="icon-circle"><i class="fa-brands fa-discord"></i></div>
                        <span>discord</span>
                    </div>
                    <div class="dock-item" onclick="goHome()">
                        <div class="icon-circle"><i class="fa-brands fa-spotify"></i></div>
                        <span>spotify</span>
                    </div>
                    <div class="dock-item" onclick="focusSearch()">
                        <div class="icon-circle"><i class="fa-solid fa-plus"></i></div>
                        <span>add</span>
                    </div>
                </div>
            </div>

            <div class="games-view" id="gamesView">
                <div class="games-header-bar">
                    <h2 style="font-weight: 500;">Library</h2>
                    <input type="text" class="game-search-input" id="gameSearch" placeholder="Search games..." oninput="filterGames()">
                </div>
                <div class="games-grid" id="gamesGrid"></div>
            </div>

            <iframe 
                id="browserFrame" 
                src="about:blank" 
                class="web-frame" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; gamepad; fullscreen">
            </iframe>
        </div>
    </div>

    <script>
        // GAME LIST CONFIGURATION
        const gamesList = [
            { name: "Slope", url: "https://krunker.io", img: "https://picsum.photos/seed/slope/200" },
            { name: "Cookie Clicker", url: "https://orteil.dashnet.org/cookieclicker/", img: "https://picsum.photos/seed/cookie/200" },
            { name: "Geometry Dash", url: "https://scratch.mit.edu/projects/105500895/embed", img: "https://picsum.photos/seed/gd/200" },
            { name: "Cut The Rope", url: "https://freegamehosting.net", img: "https://picsum.photos/seed/cut/200" },
            { name: "Retro Bowl", url: "https://game316006.konggames.com", img: "https://picsum.photos/seed/retro/200" },
            { name: "Smash Bros", url: "https://scratch.mit.edu/projects/10128407/embed", img: "https://picsum.photos/seed/smash/200" },
            { name: "Subway Surfers", url: "https://poki.com", img: "https://picsum.photos/seed/subway/200" },
            { name: "Drive Mad", url: "https://poki.com", img: "https://picsum.photos/seed/drive/200" }
        ];

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('userInput').value;
            if (user) {
                document.getElementById('sidebarUsername').innerText = user;
            }
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('bgLayer').classList.add('unblur');
            document.getElementById('dashboard').classList.add('active');
            renderGames(gamesList);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function focusSearch() {
            goHome();
            document.getElementById('urlInput').focus();
        }

        function renderGames(list) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => loadGame(game.url, game.name);
                card.innerHTML = `
                    <img src="${game.img}" alt="${game.name}">
                    <div class="game-card-title">${game.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames() {
            const query = document.getElementById('gameSearch').value.toLowerCase();
            const filtered = gamesList.filter(g => g.name.toLowerCase().includes(query));
            renderGames(filtered);
        }

        function openGamesView() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('browserFrame').style.display = 'none';
            document.getElementById('gamesView').style.display = 'flex';
            document.getElementById('currentUrl').innerText = 'petezah://games';
            document.getElementById('sidebarTabName').innerText = 'Games';
            document.getElementById('sidebar').classList.remove('open');
        }

        function loadGame(url, name) {
            const frame = document.getElementById('browserFrame');
            document.getElementById('gamesView').style.display = 'none';
            document.getElementById('homeView').style.display = 'none';
            frame.style.display = 'block';
            frame.src = url;
            document.getElementById('currentUrl').innerText = 'petezah://games/' + name.toLowerCase().replace(/\s+/g, '-');
            document.getElementById('sidebarTabName').innerText = name;
        }

        function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('urlInput').value.trim();
            if (query.toLowerCase().includes('game')) {
                openGamesView();
            } else if (query) {
                openGamesView();
            }
        }

        function goHome() {
            const frame = document.getElementById('browserFrame');
            frame.src = 'about:blank';
            frame.style.display = 'none';
            document.getElementById('gamesView').style.display = 'none';
            document.getElementById('homeView').style.display = 'flex';
            document.getElementById('currentUrl').innerText = 'petezah://home';
            document.getElementById('sidebarTabName').innerText = 'Main Tab';
            document.getElementById('sidebar').classList.remove('open');
        }
    </script>
</body>
</html>
