<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-blur" id="bgLayer"></div>

    <div class="login-box" id="loginBox">
        <h2>welcome back</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="userInput" placeholder="username" required>
            <input type="password" placeholder="password" required>
            <button type="submit" class="login-btn">login</button>
        </form>
    </div>

    <div class="dashboard" id="dashboard">
        
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
        </button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">PeteZah</h1>
                <div class="header-icons">
                    <i class="fa-solid fa-bolt"></i>
                    <i class="fa-regular fa-bookmark"></i>
                </div>
            </div>

            <div class="sidebar-section">
                <span class="section-label">TABS</span>
                <div class="active-tab-card" id="sidebarTabCard" onclick="restoreBrowser()">
                    <i class="fa-solid fa-globe"></i>
                    <span id="sidebarTabName">Games</span>
                </div>
            </div>

            <div class="sidebar-nav-grid">
                <div class="nav-grid-item"><i class="fa-solid fa-gamepad"></i><span>Games</span></div>
                <div class="nav-grid-item"><i class="fa-solid fa-grip"></i><span>Apps</span></div>
                <div class="nav-grid-item"><i class="fa-solid fa-robot"></i><span>AI</span></div>
                <div class="nav-grid-item"><i class="fa-solid fa-music"></i><span>Music</span></div>
                <div class="nav-grid-item"><i class="fa-solid fa-film"></i><span>Movies</span></div>
                <div class="nav-grid-item"><i class="fa-regular fa-comment-dots"></i><span>Chat</span></div>
            </div>

            <div class="sidebar-links">
                <div class="link-item"><i class="fa-regular fa-bookmark"></i><span>Saved</span></div>
                <div class="link-item"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></div>
                <div class="link-item"><i class="fa-solid fa-puzzle-piece"></i><span>Extensions</span></div>
            </div>

            <button class="new-tab-btn" onclick="focusSearch()">
                <i class="fa-solid fa-plus"></i> New Tab
            </button>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar"><i class="fa-regular fa-user"></i></div>
                    <div class="user-info">
                        <span class="user-name" id="sidebarUsername">Guest</span>
                        <span class="user-status">Sign in</span>
                    </div>
                </div>
                <i class="fa-solid fa-command cmd-icon"></i>
            </div>
        </aside>

        <div class="center-content">
            <div class="top-icons">
                <a href="https://youtube.com" target="_blank"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://twitch.tv" target="_blank"><i class="fa-brands fa-twitch"></i></a>
                <a href="https://discord.com" target="_blank"><i class="fa-brands fa-discord"></i></a>
                <a href="https://spotify.com" target="_blank"><i class="fa-brands fa-spotify"></i></a>
            </div>

            <div class="big-heart"><3</div>

            <form class="search-box" onsubmit="launchBrowser(event)">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="urlInput" placeholder="Have anything in mind?">
            </form>

            <div class="button-dock">
                <a href="https://youtube.com" target="_blank" class="dock-item">
                    <div class="icon-circle"><i class="fa-brands fa-youtube"></i></div>
                    <span>youtube</span>
                </a>
                <a href="https://twitch.tv" target="_blank" class="dock-item">
                    <div class="icon-circle"><i class="fa-brands fa-twitch"></i></div>
                    <span>twitch</span>
                </a>
                <a href="https://discord.com" target="_blank" class="dock-item">
                    <div class="icon-circle"><i class="fa-brands fa-discord"></i></div>
                    <span>discord</span>
                </a>
                <a href="https://spotify.com" target="_blank" class="dock-item">
                    <div class="icon-circle"><i class="fa-brands fa-spotify"></i></div>
                    <span>spotify</span>
                </a>
                <div class="dock-item">
                    <div class="icon-circle"><i class="fa-solid fa-plus"></i></div>
                    <span>add</span>
                </div>
            </div>
        </div>

        <div class="browser-window" id="browserWindow">
            <div class="browser-header">
                <div class="window-controls">
                    <button class="win-btn close-btn" onclick="closeBrowser()" title="Close"><i class="fa-solid fa-xmark"></i></button>
                    <button class="win-btn min-btn" onclick="minimizeBrowser()" title="Minimize"><i class="fa-solid fa-minus"></i></button>
                    <button class="win-btn max-btn" onclick="toggleFullscreen()" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
                </div>
                <span id="currentUrl">https://...</span>
            </div>
            <iframe id="browserFrame" src="about:blank"></iframe>
        </div>

        <div class="bottom-left-tab" id="bottomLeftTab" onclick="restoreBrowser()" title="Restore Window">
            <i class="fa-solid fa-globe"></i>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('userInput').value;
            if (user) {
                document.getElementById('sidebarUsername').innerText = user;
            }
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('bgLayer').classList.add('unblur');
            document.getElementById('dashboard').classList.add('active');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function focusSearch() {
            closeBrowser();
            document.getElementById('urlInput').focus();
        }

        function launchBrowser(event) {
            event.preventDefault();
            let query = document.getElementById('urlInput').value.trim();
            if (!query) return;

            let targetUrl = query;
            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (query.includes('.') && !query.includes(' ')) {
                    targetUrl = 'https://' + query;
                } else {
                    targetUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                }
            }

            const frame = document.getElementById('browserFrame');
            frame.src = targetUrl;
            
            document.getElementById('currentUrl').innerText = targetUrl;
            document.getElementById('sidebarTabName').innerText = query.length > 12 ? query.substring(0, 12) + '...' : query;
            document.getElementById('sidebarTabCard').classList.add('active');
            
            const win = document.getElementById('browserWindow');
            win.classList.remove('minimized-state');
            win.classList.add('active');
            
            document.getElementById('bottomLeftTab').classList.remove('visible');
        }

        function closeBrowser() {
            const win = document.getElementById('browserWindow');
            win.classList.remove('active', 'fullscreen', 'minimized-state');
            document.getElementById('browserFrame').src = 'about:blank';
            document.getElementById('bottomLeftTab').classList.remove('visible');
            document.getElementById('sidebarTabCard').classList.remove('active');
        }

        function minimizeBrowser() {
            const win = document.getElementById('browserWindow');
            win.classList.add('minimized-state');
            document.getElementById('bottomLeftTab').classList.add('visible');
        }

        function restoreBrowser() {
            const win = document.getElementById('browserWindow');
            win.classList.remove('minimized-state');
            document.getElementById('bottomLeftTab').classList.remove('visible');
        }

        function toggleFullscreen() {
            document.getElementById('browserWindow').classList.toggle('fullscreen');
        }
    </script>
</body>
</html>
