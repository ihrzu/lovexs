<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-blur" id="bgLayer"></div>

    <aside class="sidebar" id="sidebar">
        <button class="pull-button" onclick="toggleSidebar()" title="Toggle Sidebar">
            <span>lovexs</span>
        </button>

        <div class="sidebar-header">
            <h1 class="sidebar-title">lovexs</h1>
            <div class="header-icons">
                <i class="fa-solid fa-bolt"></i>
                <i class="fa-regular fa-bookmark"></i>
            </div>
        </div>

        <div class="sidebar-section">
            <span class="section-label">TABS</span>
            <div class="active-tab-card active" id="sidebarTabCard" onclick="goHome()">
                <i class="fa-solid fa-house"></i>
                <span id="sidebarTabName">Main Tab</span>
            </div>
        </div>

        <div class="sidebar-nav-grid">
            <div class="nav-grid-item" onclick="openUrl('https://poki.com')"><i class="fa-solid fa-gamepad"></i><span>Games</span></div>
            <div class="nav-grid-item" onclick="goHome()"><i class="fa-solid fa-grip"></i><span>Apps</span></div>
            <div class="nav-grid-item" onclick="openUrl('https://chatgpt.com')"><i class="fa-solid fa-robot"></i><span>AI</span></div>
            <div class="nav-grid-item" onclick="openUrl('https://spotify.com')"><i class="fa-solid fa-music"></i><span>Music</span></div>
            <div class="nav-grid-item" onclick="openUrl('https://netflix.com')"><i class="fa-solid fa-film"></i><span>Movies</span></div>
            <div class="nav-grid-item" onclick="openUrl('https://discord.com')"><i class="fa-regular fa-comment-dots"></i><span>Chat</span></div>
        </div>

        <div class="sidebar-links">
            <div class="link-item"><i class="fa-regular fa-bookmark"></i><span>Saved</span></div>
            <div class="link-item"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></div>
            <div class="link-item"><i class="fa-solid fa-puzzle-piece"></i><span>Extensions</span></div>
        </div>

        <button class="new-tab-btn" onclick="goHome()">
            <i class="fa-solid fa-plus"></i> New Tab
        </button>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar"><i class="fa-regular fa-user"></i></div>
                <div class="user-info">
                    <span class="user-name" id="sidebarUsername">Guest</span>
                    <span class="user-status">Sign in</span>
                </div>
            </div>
            <i class="fa-solid fa-command cmd-icon"></i>
        </div>
    </aside>

    <div class="login-box" id="loginBox">
        <h2>welcome back</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="userInput" placeholder="username" required>
            <input type="password" placeholder="password" required>
            <button type="submit" class="login-btn">login</button>
        </form>
    </div>

    <div class="single-tab-viewport" id="dashboard">
        <div class="tab-header">
            <div class="window-controls">
                <button class="win-btn close-btn" onclick="goHome()" title="Home"><i class="fa-solid fa-xmark"></i></button>
                <button class="win-btn min-btn" onclick="toggleSidebar()" title="Menu"><i class="fa-solid fa-minus"></i></button>
                <button class="win-btn max-btn" onclick="goHome()" title="Reset"><i class="fa-solid fa-house"></i></button>
            </div>
            <button class="home-nav-btn" onclick="goHome()" title="Return Home">
                <i class="fa-solid fa-house"></i>
            </button>
            <span class="current-tab-url" id="currentUrl">lovexs://home</span>
        </div>

        <div class="tab-body">
            <div class="center-content" id="homeView">
                <div class="top-icons">
                    <span onclick="openUrl('https://youtube.com')"><i class="fa-brands fa-youtube"></i></span>
                    <span onclick="openUrl('https://twitch.tv')"><i class="fa-brands fa-twitch"></i></span>
                    <span onclick="openUrl('https://discord.com')"><i class="fa-brands fa-discord"></i></span>
                    <span onclick="openUrl('https://spotify.com')"><i class="fa-brands fa-spotify"></i></span>
                </div>

                <div class="big-heart"><3</div>

                <form class="search-box" onsubmit="handleSearch(event)">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="urlInput" placeholder="Have anything in mind?">
                </form>

                <div class="button-dock">
                    <div class="dock-item" onclick="openUrl('https://youtube.com')">
                        <div class="icon-circle"><i class="fa-brands fa-youtube"></i></div>
                        <span>youtube</span>
                    </div>
                    <div class="dock-item" onclick="openUrl('https://twitch.tv')">
                        <div class="icon-circle"><i class="fa-brands fa-twitch"></i></div>
                        <span>twitch</span>
                    </div>
                    <div class="dock-item" onclick="openUrl('https://discord.com')">
                        <div class="icon-circle"><i class="fa-brands fa-discord"></i></div>
                        <span>discord</span>
                    </div>
                    <div class="dock-item" onclick="openUrl('https://spotify.com')">
                        <div class="icon-circle"><i class="fa-brands fa-spotify"></i></div>
                        <span>spotify</span>
                    </div>
                    <div class="dock-item" onclick="focusSearch()">
                        <div class="icon-circle"><i class="fa-solid fa-plus"></i></div>
                        <span>add</span>
                    </div>
                </div>
            </div>

            <iframe id="browserFrame" src="about:blank" class="web-frame"></iframe>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('userInput').value;
            if (user) {
                document.getElementById('sidebarUsername').innerText = user;
            }
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('bgLayer').classList.add('unblur');
            document.getElementById('dashboard').classList.add('active');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function focusSearch() {
            goHome();
            document.getElementById('urlInput').focus();
        }

        function openUrl(url) {
            const frame = document.getElementById('browserFrame');
            const homeView = document.getElementById('homeView');
            const urlDisplay = document.getElementById('currentUrl');
            const tabName = document.getElementById('sidebarTabName');

            frame.src = url;
            homeView.style.display = 'none';
            frame.style.display = 'block';

            urlDisplay.innerText = url;
            tabName.innerText = url.replace('https://', '').replace('www.', '');
            document.getElementById('sidebar').classList.remove('open');
        }

        function handleSearch(event) {
            event.preventDefault();
            let query = document.getElementById('urlInput').value.trim();
            if (!query) return;

            let targetUrl = query;
            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (query.includes('.') && !query.includes(' ')) {
                    targetUrl = 'https://' + query;
                } else {
                    targetUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                }
            }

            openUrl(targetUrl);
        }

        function goHome() {
            const frame = document.getElementById('browserFrame');
            const homeView = document.getElementById('homeView');
            
            frame.src = 'about:blank';
            frame.style.display = 'none';
            homeView.style.display = 'flex';

            document.getElementById('currentUrl').innerText = 'lovexs://home';
            document.getElementById('sidebarTabName').innerText = 'Main Tab';
            document.getElementById('sidebar').classList.remove('open');
        }
    </script>
</body>
</html>
