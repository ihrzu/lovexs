<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lovexs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background Blur Layer -->
    <div class="bg-blur" id="bgLayer"></div>

    <!-- Top Left Corner -->
    <div class="top-bar">
        <span class="top-heart">&lt;3</span>
        <div class="top-icons">
            <a href="https://youtube.com" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://twitch.tv" target="_blank"><i class="fa-brands fa-twitch"></i></a>
            <a href="https://discord.com" target="_blank"><i class="fa-brands fa-discord"></i></a>
            <a href="https://spotify.com" target="_blank"><i class="fa-brands fa-spotify"></i></a>
        </div>
    </div>

    <!-- BUBBLY LOGIN BOX -->
    <div class="login-box" id="loginBox">
        <h2>welcome back</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" placeholder="username" required>
            <input type="password" placeholder="password" required>
            <button type="submit" class="login-btn">login</button>
        </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <!-- Giant Heart in Center -->
        <div class="big-heart">&lt;3</div>

        <!-- Built-In Browser Search Bar -->
        <form class="search-box" onsubmit="launchBrowser(event)">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="urlInput" placeholder="Have anything in mind?">
        </form>

        <!-- Horizontal Dock -->
        <div class="button-dock">
            <a href="https://youtube.com" target="_blank" class="dock-btn"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://twitch.tv" target="_blank" class="dock-btn"><i class="fa-brands fa-twitch"></i></a>
            <a href="https://discord.com" target="_blank" class="dock-btn"><i class="fa-brands fa-discord"></i></a>
            <a href="https://spotify.com" target="_blank" class="dock-btn"><i class="fa-brands fa-spotify"></i></a>
            <div class="dock-btn"><i class="fa-solid fa-plus"></i></div>
        </div>

        <!-- Built-In Browser Overlay -->
        <div class="browser-window" id="browserWindow">
            <div class="browser-header">
                <button onclick="closeBrowser()"><i class="fa-solid fa-xmark"></i></button>
                <span id="currentUrl"></span>
            </div>
            <iframe id="browserFrame" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('bgLayer').classList.add('unblur');
            document.getElementById('dashboard').classList.add('active');
        }

        function launchBrowser(event) {
            event.preventDefault();
            let query = document.getElementById('urlInput').value.trim();
            if (!query) return;

            let targetUrl = query;
            if (!query.startsWith('http://') && !query.startsWith('https://')) {
                if (query.includes('.')) {
                    targetUrl = 'https://' + query;
                } else {
                    targetUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                }
            }

            document.getElementById('browserFrame').src = targetUrl;
            document.getElementById('currentUrl').innerText = targetUrl;
            document.getElementById('browserWindow').classList.add('active');
        }

        function closeBrowser() {
            document.getElementById('browserWindow').classList.remove('active');
            document.getElementById('browserFrame').src = 'about:blank';
        }
    </script>
</body>
</html>
