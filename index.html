<script>
    function handleLogin(event) {
        event.preventDefault();
        const user = document.getElementById('userInput').value;
        if (user) {
            document.getElementById('sidebarUsername').innerText = user;
        }
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('bgLayer').classList.add('unblur');
        document.getElementById('dashboard').classList.add('active');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function focusSearch() {
        goHome();
        document.getElementById('urlInput').focus();
    }

    function openUrl(url) {
        const frame = document.getElementById('browserFrame');
        const homeView = document.getElementById('homeView');
        const resultsView = document.getElementById('resultsView');
        const urlDisplay = document.getElementById('currentUrl');
        const tabName = document.getElementById('sidebarTabName');

        // Hide home and search results, show the iframe
        homeView.style.display = 'none';
        resultsView.style.display = 'none';
        frame.style.display = 'block';

        frame.src = url;
        urlDisplay.innerText = url;
        tabName.innerText = url.replace('https://', '').replace('http://', '').replace('www.', '').split('/')[0];
        document.getElementById('sidebar').classList.remove('open');
    }

    function handleSearch(event) {
        event.preventDefault();
        let query = document.getElementById('urlInput').value.trim().toLowerCase();
        if (!query) return;

        // Direct Shortcuts for Game Sites and Embeddable Web Apps
        if (query.includes('poki')) {
            openUrl('https://poki.com');
        } else if (query.includes('crazygames') || query.includes('crazy games')) {
            openUrl('https://www.crazygames.com');
        } else if (query.includes('wiki') || query.includes('wikipedia')) {
            openUrl('https://wikipedia.org');
        } else if (query.includes('archive')) {
            openUrl('https://archive.org');
        } else if (query.startsWith('http://') || query.startsWith('https://')) {
            openUrl(query);
        } else if (query.includes('.') && !query.includes(' ')) {
            openUrl('https://' + query);
        } else {
            // General query fallback list for sites that block frames
            showResultsList(query);
        }
    }

    function showResultsList(query) {
        const homeView = document.getElementById('homeView');
        const resultsView = document.getElementById('resultsView');
        const frame = document.getElementById('browserFrame');
        const urlDisplay = document.getElementById('currentUrl');
        const tabName = document.getElementById('sidebarTabName');
        const queryTitle = document.getElementById('queryTitle');
        const resultsList = document.getElementById('resultsList');

        homeView.style.display = 'none';
        frame.style.display = 'none';
        resultsView.style.display = 'flex';

        urlDisplay.innerText = 'lovexs://search?q=' + encodeURIComponent(query);
        tabName.innerText = query;
        queryTitle.innerText = 'Results for: "' + query + '"';

        resultsList.innerHTML = `
            <div class="result-card">
                <a href="https://poki.com" onclick="openUrl('https://poki.com'); return false;" class="result-title">Poki Games - Play Free Online Games</a>
                <span class="result-url">https://poki.com</span>
                <p class="result-desc">Play hundreds of free online games directly inside lovexs portal.</p>
            </div>
            <div class="result-card">
                <a href="https://www.crazygames.com" onclick="openUrl('https://www.crazygames.com'); return false;" class="result-title">CrazyGames - Free Online Games</a>
                <span class="result-url">https://www.crazygames.com</span>
                <p class="result-desc">Play browser games in your custom viewport.</p>
            </div>
            <div class="result-card">
                <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" class="result-title">Search Google for "${query}"</a>
                <span class="result-url">https://www.google.com/search?q=${encodeURIComponent(query)}</span>
                <p class="result-desc">Open in external tab (Google blocks embedded windows).</p>
            </div>
        `;

        document.getElementById('sidebar').classList.remove('open');
    }

    function goHome() {
        const homeView = document.getElementById('homeView');
        const resultsView = document.getElementById('resultsView');
        const frame = document.getElementById('browserFrame');
        
        frame.src = 'about:blank';
        frame.style.display = 'none';
        resultsView.style.display = 'none';
        homeView.style.display = 'flex';

        document.getElementById('currentUrl').innerText = 'lovexs://home';
        document.getElementById('sidebarTabName').innerText = 'Main Tab';
        document.getElementById('sidebar').classList.remove('open');
    }
</script>
